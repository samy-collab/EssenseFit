services:
  postgres:
    image: postgres:16-alpine
    container_name: essencefit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-essencefit}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-essencefit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: essencefit-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      SERVER_PORT: ${BACKEND_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-essencefit}?sslmode=disable
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-essencefit}
      DB_SSLMODE: disable
      DB_TIMEZONE: ${DB_TIMEZONE:-America/Sao_Paulo}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
      DB_CONN_MAX_LIFETIME_MIN: ${DB_CONN_MAX_LIFETIME_MIN:-30}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REDIRECT_URL: ${STRAVA_REDIRECT_URL:-http://localhost:8080/auth/strava/callback}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./uploads:/app/uploads

  frontend:
    image: node:20-alpine
    container_name: essencefit-frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      PORT: ${FRONTEND_PORT:-3000}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8080}
    command: >
      sh -c "
      if [ ! -f package.json ]; then
        echo 'Nenhum frontend React encontrado em ./frontend. Adicione a aplicação para subir este serviço.';
        sleep infinity;
      fi &&
      npm install &&
      if [ -f package-lock.json ]; then npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT:-3000};
      else npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT:-3000};
      fi"
    volumes:
      - ./frontend:/app
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
